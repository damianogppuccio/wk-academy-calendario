<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Webinar Genya</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; font-family:'Segoe UI',Arial,sans-serif; }

  .cal { max-width:736px; width:100%; }
  .cal-wrap { border-radius:12px; overflow:hidden; background:#fff; border:1px solid #E0E0E0; }

  .cal-header { background:#007AC3; padding:18px 24px 16px; }
  .cal-title { font-size:18px; font-weight:600; color:#fff; display:flex; align-items:center; gap:8px; }
  .cal-accent { width:40px; height:3px; background:#85BC20; border-radius:2px; margin-top:6px; }
  .cal-sub { font-size:12px; color:rgba(255,255,255,.7); margin-top:6px; }

  .cal-body { padding:6px 0; }

  .ev-row { display:flex; align-items:stretch; padding:0 24px; text-decoration:none; }
  .ev-row:hover .ev-content { background:#F8FBFD; }

  .ev-timeline {
    width:3px; background:#D6EBF7; margin:0 22px 0 1px;
    flex-shrink:0; position:relative;
  }
  .ev-dot {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
  }
  .ev-dot-future { width:9px; height:9px; background:#85BC20; border:2px solid #EBF5D0; }
  .ev-dot-soon   { width:10px; height:10px; background:#F5A623; border:2px solid #FFF3CD; }
  .ev-dot-live   { width:10px; height:10px; background:#E2231A; border:2px solid #FADADD; }

  .ev-content {
    flex:1; display:flex; align-items:center; gap:14px;
    padding:13px 0; border-bottom:1px solid #F0F0F0;
    transition:background .15s; border-radius:6px;
  }
  .ev-row:last-child .ev-content { border-bottom:none; }

  .ev-date { min-width:44px; text-align:center; }
  .ev-dd { font-size:20px; font-weight:700; color:#007AC3; line-height:1; }
  .ev-mm { font-size:10px; color:#4FA8D8; text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }

  .ev-info { flex:1; min-width:0; }
  .ev-name { font-size:14px; font-weight:600; color:#353535; }
  .ev-time { font-size:12px; color:#777; margin-top:2px; display:flex; align-items:center; gap:4px; }

  .badge-live {
    background:#E2231A; color:#fff;
    font-size:11px; font-weight:700;
    padding:4px 12px; border-radius:20px;
    white-space:nowrap; letter-spacing:.3px;
    animation:pulse 1.2s ease-in-out infinite;
    flex-shrink:0;
  }
  .badge-soon {
    background:#FFF3CD; color:#7D6608;
    font-size:11px; font-weight:600;
    padding:4px 12px; border-radius:20px;
    white-space:nowrap; flex-shrink:0;
  }

  .ev-chevron { font-size:16px; color:#D6EBF7; flex-shrink:0; }

  .empty { padding:24px 0; text-align:center; color:#777; font-size:13px; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
</style>
</head>
<body>

<div class="cal" id="cal"></div>

<script>
/*  ╔══════════════════════════════════════════════════════════════════╗
    ║           📅  TABELLA EVENTI — COMPILARE QUI  📅               ║
    ║                                                                 ║
    ║  Inserire fino a 20 eventi. Il widget mostra automaticamente   ║
    ║  i prossimi 6 non ancora terminati, in ordine cronologico.     ║
    ║  Gli eventi passati vengono scartati da soli.                  ║
    ║                                                                 ║
    ║  ● 30 min prima dell'inizio → badge arancione "Tra poco live" ║
    ║  ● Durante l'evento         → badge rosso lampeggiante "LIVE" ║
    ║                                                                 ║
    ║  Formato:                                                       ║
    ║    data        "GG/MM/AAAA"                                    ║
    ║    ora_inizio  "HH:MM"        (formato 24h, orario Roma)      ║
    ║    ora_fine    "HH:MM"        (formato 24h, orario Roma)      ║
    ║    titolo      "Nome del webinar"                              ║
    ║    link        "https://..."  (URL iscrizione/accesso)         ║
    ╚══════════════════════════════════════════════════════════════════╝ */

var EVENTS = [
  { data:"27/05/2026", ora_inizio:"08:00", ora_fine:"22:00", titolo:"Overview",                   link:"https://google.com.au" },
  { data:"27/05/2026", ora_inizio:"22:30", ora_fine:"23:30", titolo:"Contabilità IVA base",       link:"https://google.com.au" },
  { data:"30/05/2026", ora_inizio:"10:00", ora_fine:"12:00", titolo:"Contabilità generale",       link:"https://google.com.au" },
  { data:"02/06/2026", ora_inizio:"10:00", ora_fine:"11:30", titolo:"Gestione cespiti",           link:"https://google.com.au" },
  { data:"06/06/2026", ora_inizio:"14:00", ora_fine:"15:30", titolo:"Bilancio e chiusure",        link:"https://google.com.au" },
  { data:"09/06/2026", ora_inizio:"10:00", ora_fine:"11:00", titolo:"Dichiarazioni fiscali",      link:"https://google.com.au" },
  { data:"13/06/2026", ora_inizio:"10:00", ora_fine:"11:30", titolo:"Fatturazione elettronica",   link:"https://google.com.au" },
  { data:"16/06/2026", ora_inizio:"14:00", ora_fine:"15:00", titolo:"F24 e versamenti",           link:"https://google.com.au" },
  { data:"20/06/2026", ora_inizio:"10:00", ora_fine:"11:00", titolo:"Ratei e risconti",           link:"https://google.com.au" },
  { data:"23/06/2026", ora_inizio:"10:00", ora_fine:"11:30", titolo:"Note di credito e debito",   link:"https://google.com.au" },
  { data:"27/06/2026", ora_inizio:"14:00", ora_fine:"15:30", titolo:"Liquidazione IVA",           link:"https://google.com.au" },
  { data:"30/06/2026", ora_inizio:"10:00", ora_fine:"11:00", titolo:"Registri contabili",         link:"https://google.com.au" },
  { data:"04/07/2026", ora_inizio:"10:00", ora_fine:"12:00", titolo:"Piano dei conti",            link:"https://google.com.au" },
  { data:"07/07/2026", ora_inizio:"14:00", ora_fine:"15:30", titolo:"Scadenzario e pagamenti",    link:"https://google.com.au" },
  { data:"11/07/2026", ora_inizio:"10:00", ora_fine:"11:00", titolo:"Ritenute d'acconto",         link:"https://google.com.au" },
  { data:"14/07/2026", ora_inizio:"10:00", ora_fine:"11:30", titolo:"Comunicazioni periodiche",   link:"https://google.com.au" },
  { data:"18/07/2026", ora_inizio:"14:00", ora_fine:"15:00", titolo:"Gestione clienti/fornitori", link:"https://google.com.au" },
  { data:"21/07/2026", ora_inizio:"10:00", ora_fine:"11:00", titolo:"Ammortamenti",               link:"https://google.com.au" },
  { data:"25/07/2026", ora_inizio:"10:00", ora_fine:"12:00", titolo:"Chiusura trimestrale",       link:"https://google.com.au" },
  { data:"28/07/2026", ora_inizio:"14:00", ora_fine:"15:30", titolo:"Report personalizzati",      link:"https://google.com.au" },
];

/* ══════════════════════════════════════════════════════════════════
   DA QUI IN POI NON MODIFICARE
   ══════════════════════════════════════════════════════════════════ */

(function(){

  var MESI = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  var GIORNI = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

  function parseDate(dateStr, timeStr) {
    var d = dateStr.split('/');
    var t = timeStr.split(':');
    return new Date(+d[2], +d[1]-1, +d[0], +t[0], +t[1], 0);
  }

  function nowRome() {
    var s = new Date().toLocaleString('en-US', { timeZone:'Europe/Rome' });
    return new Date(s);
  }

  function render() {
    var now = nowRome();

    var list = EVENTS
      .map(function(e) {
        return {
          start:  parseDate(e.data, e.ora_inizio),
          end:    parseDate(e.data, e.ora_fine),
          titolo: e.titolo,
          link:   e.link,
          oi:     e.ora_inizio,
          of:     e.ora_fine
        };
      })
      .filter(function(e) { return e.end > now; })
      .sort(function(a,b) { return a.start - b.start; })
      .slice(0, 6);

    var rows = '';

    list.forEach(function(e) {
      var dd   = ('0' + e.start.getDate()).slice(-2);
      var mm   = MESI[e.start.getMonth()];
      var gg   = GIORNI[e.start.getDay()];
      var diff = e.start - now;
      var isLive = now >= e.start && now < e.end;
      var isSoon = !isLive && diff > 0 && diff <= 30 * 60 * 1000;

      var dotClass = 'ev-dot-future';
      if (isLive)      dotClass = 'ev-dot-live';
      else if (isSoon) dotClass = 'ev-dot-soon';

      var badge = '';
      if (isLive)      badge = '<span class="badge-live">\u25CF LIVE</span>';
      else if (isSoon) badge = '<span class="badge-soon">Tra poco live</span>';

      rows += ''
        + '<a class="ev-row" href="' + (e.link || '#') + '" target="_blank">'
        +   '<div class="ev-timeline">'
        +     '<div class="ev-dot ' + dotClass + '"></div>'
        +   '</div>'
        +   '<div class="ev-content">'
        +     '<div class="ev-date">'
        +       '<div class="ev-dd">' + dd + '</div>'
        +       '<div class="ev-mm">' + mm + '</div>'
        +     '</div>'
        +     '<div class="ev-info">'
        +       '<div class="ev-name">' + e.titolo + '</div>'
        +       '<div class="ev-time">'
        +         '<i class="ti ti-clock" style="font-size:13px;" aria-hidden="true"></i>'
        +         gg + ' \u00B7 ' + e.oi + ' \u2013 ' + e.of
        +       '</div>'
        +     '</div>'
        +     badge
        +     '<i class="ti ti-chevron-right ev-chevron" aria-hidden="true"></i>'
        +   '</div>'
        + '</a>';
    });

    if (!rows) {
      rows = '<div class="empty">Nessun webinar in programma</div>';
    }

    document.getElementById('cal').innerHTML = ''
      + '<div class="cal-wrap">'
      +   '<div class="cal-header">'
      +     '<div class="cal-title">'
      +       '<i class="ti ti-calendar-event" style="font-size:20px;" aria-hidden="true"></i>'
      +       'Calendario webinar Genya'
      +     '</div>'
      +     '<div class="cal-accent"></div>'
      +     '<div class="cal-sub">Prossimi eventi in programma</div>'
      +   '</div>'
      +   '<div class="cal-body">' + rows + '</div>'
      + '</div>';
  }

  render();
  setInterval(render, 30000);

})();
</script>

</body>
</html>
